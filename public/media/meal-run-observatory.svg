<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V-GENE Meal Run Observatory</title>
  <desc id="desc">A dark cybernetic observatory table with layered simulation grids, entity traces, and tactical intervention marks.</desc>
  <defs>
    <linearGradient id="tableGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00eaff" stop-opacity="0.55"/>
      <stop offset="0.46" stop-color="#2cf58a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bd00ff" stop-opacity="0.42"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
