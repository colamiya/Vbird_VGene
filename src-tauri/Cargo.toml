[package]
name = "digital-life-platform"
version = "0.1.0"
description = "A high-performance digital life simulation"
authors = ["Vbird contributors"]
license = "MIT"
repository = "https://github.com/colamiya/Vbird_VGene"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[features]
default = []
cuda = ["dep:cudarc", "cudarc/cuda-12080"]

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "43.0.2"
sysinfo = "0.37.2"
rayon = "1.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
rand = "0.9.2"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
wat = "1.0"
dashmap = "6.1.0"
sha2 = "0.10"
zstd = "0.14"
nvml-wrapper = "0.10.0"
chrono = "0.4"
cudarc = { version = "0.19.8", optional = true, default-features = false, features = ["std", "driver", "fallback-dynamic-loading"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
