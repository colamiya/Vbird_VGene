[package]
name = "digital-life-platform"
version = "0.1.0"
description = "A high-performance digital life simulation"
authors = ["Jules"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "41.0.0"
sysinfo = "0.33"
rayon = "1.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
once_cell = "1.19"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
wat = "1.0"
